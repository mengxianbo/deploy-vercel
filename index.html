
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 图片生成器</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 30px 15px;
    font-family: Arial, sans-serif;
    background: #101522;
    color: #fff;
}
.container {
    max-width: 850px;
    margin: auto;
    background: #1b2335;
    padding: 25px;
    border-radius: 16px;
}
h1 { text-align: center; }
p { color: #aab5ca; }
label {
    display: block;
    margin: 18px 0 8px;
}
textarea, select, input {
    width: 100%;
    padding: 13px;
    border: 1px solid #39445c;
    border-radius: 8px;
    background: #111827;
    color: white;
    font-size: 15px;
}
textarea { min-height: 110px; resize: vertical; }
button {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: 0;
    border-radius: 8px;
    background: #655cf5;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
button:hover { background: #8178ff; }
.secondary { background: #34415b; }
.preview {
    margin-top: 25px;
    text-align: center;
}
.preview img {
    max-width: 100%;
    border-radius: 12px;
    margin-top: 15px;
}
.status {
    color: #aab5ca;
    margin-top: 15px;
    text-align: center;
}
</style>
</head>

<body>
<div class="container">

<h1>🎨 AI 图片生成器</h1>
<p style="text-align:center">输入你的创意，生成 AI 绘画提示词</p>

<label>图片描述</label>
<textarea id="prompt"
placeholder="例如：未来科技城市，赛博朋克风格，霓虹灯，高清细节..."></textarea>

<label>负面提示词</label>
<textarea id="negative"
placeholder="例如：模糊、低质量、变形、噪点"></textarea>

<label>图片风格</label>
<select id="style">
<option value="写实摄影风格">写实摄影</option>
<option value="二次元动漫风格">动漫二次元</option>
<option value="赛博朋克风格">赛博朋克</option>
<option value="3D渲染风格">3D 渲染</option>
<option value="油画艺术风格">油画艺术</option>
<option value="水彩画风格">水彩画</option>
<option value="极简主义风格">极简主义</option>
<option value="电影级画面">电影级画面</option>
</select>

<label>图片尺寸</label>
<select id="size">
<option value="1024x1024">正方形 1:1</option>
<option value="1024x1536">竖屏 2:3</option>
<option value="1536x1024">横屏 3:2</option>
</select>

<button onclick="generatePrompt()">生成图片提示词</button>
<button class="secondary" onclick="copyPrompt()">复制提示词</button>

<div class="preview">
<h3>生成结果</h3>
<div id="result">图片预览区域</div>
</div>

<p class="status" id="status"></p>

</div>

<script>
function generatePrompt() {
    const description =
        document.getElementById("prompt").value.trim();

    const negative =
        document.getElementById("negative").value.trim();

    const style =
        document.getElementById("style").value;

    const size =
        document.getElementById("size").value;

    if (!description) {
        alert("请先输入图片描述！");
        return;
    }

    const finalPrompt =
        description +
        "，" + style +
        "，高清画质，精细细节，专业构图";

    const output =
        "正向提示词：\n" + finalPrompt +
        "\n\n负面提示词：\n" + negative +
        "\n\n图片尺寸：" + size;

    document.getElementById("result").innerHTML =
        "<textarea id='output' style='height:180px'>" +
        escapeHTML(output) +
        "</textarea>";

    document.getElementById("status").innerText =
        "提示词生成成功！可复制到 AI 图片生成平台使用。";
}

function escapeHTML(str) {
    return str.replace(/[&<>"']/g, function(c) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[c];
    });
}

function copyPrompt() {
    const output = document.getElementById("output");

    if (!output) {
        alert("请先生成提示词！");
        return;
    }

    output.select();
    navigator.clipboard.writeText(output.value);

    document.getElementById("status").innerText =
        "提示词已复制！";
}
</script>
</body>
</html>
